<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HRMS Lite{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="hrms-layout">
  <aside class="hrms-sidebar">
    <a href="{% url 'dashboard' %}" class="hrms-sidebar-brand">HRMS Lite</a>
    <nav class="hrms-sidebar-nav">
      <a href="{% url 'dashboard' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <span class="hrms-sidebar-icon">📊</span>
        Dashboard
      </a>
      <a href="{% url 'employees:employee_list' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'employee_list' or request.resolver_match.url_name == 'employee_attendance' %}active{% endif %}">
        <span class="hrms-sidebar-icon">👥</span>
        Manage Employees
      </a>
      <a href="{% url 'employees:employee_add' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'employee_add' %}active{% endif %}">
        <span class="hrms-sidebar-icon">➕</span>
        Add Employee
      </a>
      <a href="{% url 'employees:attendance_add' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'attendance_add' %}active{% endif %}">
        <span class="hrms-sidebar-icon">📅</span>
        Add Attendance
      </a>
    </nav>
  </aside>
  <div class="hrms-wrap">
    <header class="hrms-topbar">
      <h1 class="hrms-topbar-title">{% block page_heading %}HR Dashboard{% endblock %}</h1>
      <form action="{% url 'employees:employee_list' %}" method="get" class="hrms-search-form">
        <input type="search" name="q" value="{{ request.GET.q|default:'' }}" class="hrms-search-input" placeholder="Search employees…">
        <button type="submit" class="hrms-search-btn" aria-label="Search">🔍</button>
      </form>
    </header>
    <main class="hrms-main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
