<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HRMS Lite{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="hrms-layout">
  <aside class="hrms-sidebar" id="hrmsSidebar">
    <a href="{% url 'dashboard' %}" class="hrms-sidebar-brand">
      <span class="hrms-sidebar-text">HRMS Lite</span>
    </a>
    <nav class="hrms-sidebar-nav">
      <a href="{% url 'dashboard' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <span class="hrms-sidebar-icon">📊</span>
        <span class="hrms-sidebar-text">Dashboard</span>
      </a>
      <a href="{% url 'employees:employee_list' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'employee_list' or request.resolver_match.url_name == 'employee_attendance' %}active{% endif %}">
        <span class="hrms-sidebar-icon">👥</span>
        <span class="hrms-sidebar-text">Manage Employees</span>
      </a>
      <a href="{% url 'employees:employee_add' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'employee_add' %}active{% endif %}">
        <span class="hrms-sidebar-icon">➕</span>
        <span class="hrms-sidebar-text">Add Employee</span>
      </a>
      <a href="{% url 'employees:attendance_add' %}" class="hrms-sidebar-link {% if request.resolver_match.url_name == 'attendance_add' %}active{% endif %}">
        <span class="hrms-sidebar-icon">📅</span>
        <span class="hrms-sidebar-text">Add Attendance</span>
      </a>
    </nav>
  </aside>
  <div class="hrms-wrap">
    <header class="hrms-topbar">
      <button class="hrms-hamburger" id="hrmsHamburger" type="button" aria-label="Open menu" aria-controls="hrmsSidebar" aria-expanded="false">
        <span class="hrms-hamburger-lines" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </button>
      <h1 class="hrms-topbar-title">{% block page_heading %}HR Dashboard{% endblock %}</h1>
      <form action="{% url 'employees:employee_list' %}" method="get" class="hrms-search-form">
        <input type="search" name="q" value="{{ request.GET.q|default:'' }}" class="hrms-search-input" placeholder="Search employees…">
        <button type="submit" class="hrms-search-btn" aria-label="Search">🔍</button>
      </form>
    </header>
    <main class="hrms-main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="hrmsBackdrop" class="hrms-backdrop" hidden></div>

  <script>
    (function() {
      var hamburger = document.getElementById('hrmsHamburger');
      var sidebar = document.getElementById('hrmsSidebar');
      var backdrop = document.getElementById('hrmsBackdrop');
      if (!hamburger || !sidebar || !backdrop) return;

      function setOpen(open) {
        document.body.classList.toggle('hrms-sidebar-open', open);
        hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
        backdrop.hidden = !open;
      }

      hamburger.addEventListener('click', function() {
        var open = !document.body.classList.contains('hrms-sidebar-open');
        setOpen(open);
      });

      backdrop.addEventListener('click', function() {
        setOpen(false);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') setOpen(false);
      });

      var links = sidebar.querySelectorAll('.hrms-sidebar-link, .hrms-sidebar-brand');
      links.forEach(function(link) {
        link.addEventListener('click', function() {
          // Close drawer after navigation on mobile.
          if (window.matchMedia && window.matchMedia('(max-width: 576px)').matches) {
            setOpen(false);
          }
        });
      });
    })();
  </script>
</body>
</html>
